services:
  - type: web
    name: mlcis-gradebook-backend
    runtime: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mlcis-db
          property: connectionString
      - key: MLCIS_SCORING_TEMPLATE
        sync: false
      - key: MLCIS_QUARTER_REPORT_TEMPLATE
        sync: false
      - key: MLCIS_SEMESTER_REPORT_TEMPLATE
        sync: false
      - key: MLCIS_END_YEAR_REPORT_TEMPLATE
        sync: false
      - key: MLCIS_JOB_RETENTION_SECONDS
        value: "600"

databases:
  - name: mlcis-db
    plan: starter
    databaseName: mlcis
    user: mlcis_user