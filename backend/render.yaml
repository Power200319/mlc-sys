services:
  - type: web
    name: mlcis-gradebook-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mlcis-db
          property: connectionString
      - key: MLCIS_JOB_RETENTION_SECONDS
        value: "600"

databases:
  - name: mlcis-db
    plan: starter
    databaseName: mlcis
    user: mlcis_user
